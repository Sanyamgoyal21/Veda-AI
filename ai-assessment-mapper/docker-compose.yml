version: "3.9"

services:
  agentic-ai:
    build: ./agentic-ai
    ports:
      - "8000:8000"
    environment:
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-5}
      - PDF_RENDER_DPI=200
      - MAX_IMAGE_DIMENSION=1600

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://agentic-ai:8000
      - CORS_ORIGIN=http://localhost:5173
      - MAX_FILE_SIZE_MB=10
    depends_on:
      - agentic-ai
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-uploads:
